name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_project.py
      - run: python tools/build_release.py
      - name: Archive the tested source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: git archive --format=zip --output=dist/source.zip HEAD
      - name: Retain reproducible review artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-source-and-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version if missing
    needs: check
    if: >-
      github.repository == 'gcerretani/schierami' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: schierami-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_project.py
      - run: python tools/build_release.py
      - name: Create or complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(cat dist/VERSION)"
          TAG="v${VERSION}"

          resolve_tag_commit() {
            local ref type sha
            ref="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null || true)"
            if [ -z "$ref" ]; then
              return 1
            fi
            type="$(printf '%s' "$ref" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])')"
            sha="$(printf '%s' "$ref" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"
            if [ "$type" = "tag" ]; then
              sha="$(gh api "repos/${REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
            elif [ "$type" != "commit" ]; then
              echo "Unsupported tag object type: $type" >&2
              exit 1
            fi
            printf '%s' "$sha"
          }

          if gh api "repos/${REPOSITORY}/releases/tags/${TAG}" >/tmp/release.json 2>/dev/null; then
            DRAFT="$(python -c 'import json; print(str(json.load(open("/tmp/release.json"))["draft"]).lower())')"
            if [ "$DRAFT" = "false" ]; then
              echo "${TAG} is already published; leaving published history untouched."
              exit 0
            fi
            TAG_COMMIT="$(resolve_tag_commit)"
            if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Draft ${TAG} belongs to ${TAG_COMMIT}, not ${RELEASE_COMMIT}; refusing to move it." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/skill.zip dist/schierami-plugin.zip dist/SHA256SUMS --repo "$REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$REPOSITORY" --title "Schierami ${TAG}" --notes-file dist/RELEASE_NOTES.md
          else
            if TAG_COMMIT="$(resolve_tag_commit)"; then
              if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
                echo "Tag ${TAG} already points to ${TAG_COMMIT}; refusing to move it." >&2
                exit 1
              fi
            fi
            gh release create "$TAG" dist/skill.zip dist/schierami-plugin.zip dist/SHA256SUMS \
              --repo "$REPOSITORY" --target "$RELEASE_COMMIT" --title "Schierami ${TAG}" \
              --notes-file dist/RELEASE_NOTES.md --draft
          fi

          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest
